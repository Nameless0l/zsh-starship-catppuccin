# tldr (tealdeer) : exemples courts pour une commande, "tldr tar" au lieu de "man tar"
# Couleurs Catppuccin Mocha. Toutes les options : https://tealdeer-rs.github.io/tealdeer/config.html

[updates]
auto_update = true
auto_update_interval_hours = 720

[style.command_name]
foreground = { rgb = { r = 203, g = 166, b = 247 } }
bold = true

[style.example_text]
foreground = { rgb = { r = 166, g = 227, b = 161 } }

[style.example_code]
foreground = { rgb = { r = 137, g = 180, b = 250 } }

[style.example_variable]
foreground = { rgb = { r = 250, g = 179, b = 135 } }
underline = true
