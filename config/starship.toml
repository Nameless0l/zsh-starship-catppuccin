"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[╭─](fg:surface2)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$c\
$python\
$nodejs\
$php\
$rust\
${custom.yocto}\
$fill\
$cmd_duration\
$status\
$jobs\
$sudo\
$time
[╰─](fg:surface2)$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:mauve fg:crust"
format = "[](fg:mauve)[ $symbol ]($style)"

[os.symbols]
Ubuntu = ""

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:mauve fg:red bold"
format = "[$user ]($style)[](fg:mauve) "

[hostname]
format = "[@$hostname](bold fg:mauve) "

[directory]
style = "bg:peach fg:crust"
read_only = " "
read_only_style = "bg:peach fg:red"
truncation_length = 3
truncation_symbol = "…/"
format = "[](fg:peach)[  $path]($style)[$read_only]($read_only_style)[ ]($style)[](fg:peach) "

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = "[](fg:yellow)[ $symbol $branch]($style)"

[git_status]
style = "bg:yellow fg:crust"
format = "[( $all_status$ahead_behind) ]($style)[](fg:yellow) "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"
stashed = "≡${count}"

[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[c]
symbol = ""
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[](fg:green)[ $symbol( $version) ]($style)[](fg:green) "

[python]
symbol = ""
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[](fg:green)[ $symbol( $version)( $virtualenv) ]($style)[](fg:green) "

[nodejs]
symbol = ""
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[](fg:green)[ $symbol( $version) ]($style)[](fg:green) "

[php]
symbol = ""
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[](fg:green)[ $symbol( $version) ]($style)[](fg:green) "

[rust]
symbol = ""
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[](fg:green)[ $symbol( $version) ]($style)[](fg:green) "

[custom.yocto]
when = 'test -n "$BUILDDIR"'
command = 'basename "$BUILDDIR"'
shell = ["sh"]
symbol = ""
style = "bg:blue fg:crust"
format = "[](fg:blue)[ $symbol $output ]($style)[](fg:blue) "

[fill]
symbol = "─"
style = "fg:surface1"

[cmd_duration]
min_time = 2000
format = " [ $duration](fg:yellow)"

[status]
disabled = false
symbol = ""
style = "fg:red"
format = " [$symbol $status( $signal_name)]($style)"

[jobs]
symbol = " "
style = "fg:blue"
format = " [$symbol$number]($style)"

[sudo]
disabled = false
symbol = ""
style = "fg:peach"
format = " [$symbol]($style)"

[time]
disabled = false
time_format = "%R"
format = " [ $time](fg:lavender)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[palettes.catppuccin_mocha]
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89b4fa"
mauve = "#cba6f7"
lavender = "#b4befe"
overlay1 = "#7f849c"
surface2 = "#585b70"
surface1 = "#45475a"
crust = "#11111b"
